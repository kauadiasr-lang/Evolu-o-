name: Publicar GS Evolução (GitHub Pages)

# Em todo push: tipos, testes, montagem do site e verificação do site montado (assets, Worker, PWA, versões).
# Só no branch PADRÃO do repositório o site é publicado. Pré-requisito (uma vez): Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Testes (física, evolução, ecologia, interface)
        run: npx vitest run
      - name: Montar o site (jogo atual + versões arquivadas + página inicial)
        run: node scripts/build-site.mjs
      - name: Navegador para os testes do site
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verificar o site montado (assets, Worker, URL, toque, PWA offline, versões)
        run: node scripts/site-test.mjs
      - name: Verificar a atualização segura do PWA
        run: node scripts/pwa-update-test.mjs
      - name: Artefato do Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
